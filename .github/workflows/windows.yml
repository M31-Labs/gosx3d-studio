# Windows evidence floor for the desktopHost capability matrix
# (docs/platform-capabilities.md): native Windows execution of the
# browser-free evidence suite plus MSIX staging/packing. A green run here is
# the minimum bar for any "available" desktop claim; the certify JSON is the
# attached evidence.
#
# Dependencies come from the versions go.mod pins and go.sum checksums, so this
# builds exactly what Linux CI and a release build. The released GoSX and
# Arbiter modules resolve through the public Go module proxy.
name: windows-evidence

on:
  push:
    branches: [main, codex/deep-implementation-foundation]
  workflow_dispatch: {}

jobs:
  evidence:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: gosx3d-studio
    steps:
      - uses: actions/checkout@v7
        with:
          path: gosx3d-studio
      - uses: actions/setup-go@v7
        with:
          go-version-file: gosx3d-studio/go.mod
          cache-dependency-path: gosx3d-studio/go.sum
      - name: Module pins are current
        run: go mod verify; if ($LASTEXITCODE -ne 0) { exit 1 }; go mod tidy -diff
      - name: Unit and integration tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Browser-free smoke evidence (frame + exact ray)
        run: go run ./cmd/studio-smoke > studio-smoke.json
      - name: Deterministic certification evidence
        run: go run ./cmd/studio-certify > studio-certify.json
      # Build the CLI from the same pinned GoSX the tests just ran against, so
      # the bundler and the runtime can never be different versions.
      - name: Build the pinned gosx CLI
        run: go build -o ../gosx-cli.exe m31labs.dev/gosx/cmd/gosx
      - name: Install pinned TinyGo for production WASM
        run: |
          $version = "0.41.1"
          $archive = Join-Path $env:RUNNER_TEMP "tinygo-$version-windows-amd64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "tinygo-$version"
          $url = "https://github.com/tinygo-org/tinygo/releases/download/v$version/tinygo$version.windows-amd64.zip"
          $expectedSHA256 = "56b8ccf2c705b6a5da14b319ecffc73db2850cd5d09681d65022e604311276b5"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSHA256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSHA256 -ne $expectedSHA256) {
            throw "TinyGo archive checksum mismatch: $actualSHA256"
          }
          Expand-Archive -Path $archive -DestinationPath $destination
          $tinyGoBin = Join-Path $destination "tinygo\bin"
          $tinyGoExecutable = Join-Path $tinyGoBin "tinygo.exe"
          if (-not (Test-Path $tinyGoExecutable -PathType Leaf)) {
            throw "TinyGo archive did not contain $tinyGoExecutable"
          }
          $tinyGoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $tinyGoExecutable version
      # TinyGo's production optimizer is distributed by Binaryen rather than
      # in the Windows TinyGo archive. Pin and verify it just like TinyGo so
      # offline packaging does not depend on mutable runner state.
      - name: Install pinned Binaryen wasm-opt
        run: |
          $binaryenVersion = "132"
          $archive = Join-Path $env:RUNNER_TEMP "binaryen-version_$binaryenVersion-x86_64-windows.tar.gz"
          $destination = Join-Path $env:RUNNER_TEMP "binaryen-$binaryenVersion"
          $url = "https://github.com/WebAssembly/binaryen/releases/download/version_$binaryenVersion/binaryen-version_$binaryenVersion-x86_64-windows.tar.gz"
          $expectedSHA256 = "2089428ec98c899b45ee5d00636ddd6e2da8636cc473ef50b165cc25793ef7cb"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSHA256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSHA256 -ne $expectedSHA256) {
            throw "Binaryen archive checksum mismatch: $actualSHA256"
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          tar -xzf $archive -C $destination
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $wasmOpt = Get-ChildItem -Path $destination -Recurse -Filter wasm-opt.exe -File | Select-Object -First 1
          if (-not $wasmOpt) {
            throw "Binaryen archive did not contain wasm-opt.exe"
          }
          "WASMOPT=$($wasmOpt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $wasmOpt.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $wasmOpt.FullName --version
      # GoSX builds its capability-linked WASM variants concurrently. On a
      # fresh Windows runner, parallel TinyGo processes can race while creating
      # the shared WASI libc archive and one loses the final rename with
      # ERROR_ACCESS_DENIED. Build one tiny browser target first so that cache
      # initialization is serialized; the real build still runs every variant.
      - name: Warm TinyGo WASI cache serially
        run: |
          $warmupDir = Join-Path $env:RUNNER_TEMP "gosx-tinygo-cache-warmup"
          New-Item -ItemType Directory -Path $warmupDir -Force | Out-Null
          $source = Join-Path $warmupDir "main.go"
          $output = Join-Path $warmupDir "warmup.wasm"
          @'
          package main

          import "syscall/js"

          func main() {
              _ = js.Global()
          }
          '@ | Set-Content -Path $source -Encoding utf8
          tinygo build -target wasm -no-debug -panic=trap -o $output $source
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path $output -PathType Leaf)) {
            throw "TinyGo cache warmup did not produce $output"
          }
      - name: Offline bundle + MSIX staging
        run: ..\gosx-cli.exe build --prod --offline .
      - name: MSIX pack (best effort until signing identity lands)
        continue-on-error: true
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter MakeAppx.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1
          if (-not $makeappx) { Write-Host "MakeAppx not found; staging only"; exit 0 }
          & $makeappx.FullName pack /d dist\msix\package /p dist\gosx3d-studio-unsigned.msix /o
      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-evidence
          path: |
            gosx3d-studio/studio-smoke.json
            gosx3d-studio/studio-certify.json
            gosx3d-studio/dist/*.msix
          if-no-files-found: warn
