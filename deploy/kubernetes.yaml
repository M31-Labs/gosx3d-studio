apiVersion: apps/v1
kind: Deployment
metadata:
  name: gosx3d-studio
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gosx3d-studio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gosx3d-studio
        app.kubernetes.io/part-of: m31labs
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: ns1007492
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: regcred
      containers:
        - name: studio
          # REQUIRED: render this template with GOSX3D_IMAGE set to an immutable
          # Harbor digest, never a mutable tag. See deploy/README.md.
          image: ${GOSX3D_IMAGE}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: APP_NAME
              value: GoSX 3D Studio
            - name: GOSX_ENV
              value: production
            - name: STUDIO_SERVER_ONLY
              value: "1"
            - name: STUDIO_DEMO_MODE
              value: "1"
          envFrom:
            - secretRef:
                # This Secret is deliberately not included in source control.
                # It must contain SESSION_SECRET and STUDIO_ACTION_TOKEN.
                name: gosx3d-studio-runtime
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: temporary-workspace
              mountPath: /tmp
      volumes:
        - name: temporary-workspace
          emptyDir:
            sizeLimit: 1Gi
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gosx3d-studio
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gosx3d-studio
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gosx3d-studio-redirect-https
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gosx3d-studio-security-headers
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
spec:
  headers:
    contentTypeNosniff: true
    forceSTSHeader: true
    referrerPolicy: strict-origin-when-cross-origin
    stsIncludeSubdomains: false
    stsPreload: false
    stsSeconds: 31536000
    customResponseHeaders:
      Permissions-Policy: camera=(), geolocation=(), microphone=(), payment=(), usb=()
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: gosx3d-studio-modern-tls
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
spec:
  minVersion: VersionTLS12
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gosx3d-studio-volatile-assets
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
spec:
  headers:
    customResponseHeaders:
      Cache-Control: no-store
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gosx3d-studio-http-redirect
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: m31labs-gosx3d-studio-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gosx3d.m31labs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gosx3d-studio
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gosx3d-studio
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: m31labs-gosx3d-studio-security-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls.options: m31labs-gosx3d-studio-modern-tls@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gosx3d.m31labs.dev
      secretName: gosx3d-studio-tls
  rules:
    - host: gosx3d.m31labs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gosx3d-studio
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gosx3d-studio-volatile-assets
  namespace: m31labs
  labels:
    app.kubernetes.io/name: gosx3d-studio
    app.kubernetes.io/part-of: m31labs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: m31labs-gosx3d-studio-security-headers@kubernetescrd,m31labs-gosx3d-studio-volatile-assets@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls.options: m31labs-gosx3d-studio-modern-tls@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gosx3d.m31labs.dev
      secretName: gosx3d-studio-tls
  rules:
    - host: gosx3d.m31labs.dev
      http:
        paths:
          - path: /favicon.svg
            pathType: Exact
            backend: &studioUnversionedAssetBackend
              service:
                name: gosx3d-studio
                port:
                  name: http
          - path: /styles.css
            pathType: Exact
            backend: *studioUnversionedAssetBackend
          - path: /studio-camera.js
            pathType: Exact
            backend: *studioUnversionedAssetBackend
          - path: /studio-certification.js
            pathType: Exact
            backend: *studioUnversionedAssetBackend
          - path: /studio-gizmo.js
            pathType: Exact
            backend: *studioUnversionedAssetBackend
          - path: /studio-interactions.js
            pathType: Exact
            backend: *studioUnversionedAssetBackend
          - path: /studio-project.js
            pathType: Exact
            backend: *studioUnversionedAssetBackend
          - path: /studio-selection.js
            pathType: Exact
            backend: *studioUnversionedAssetBackend
          - path: /studio-webmcp-ui.js
            pathType: Exact
            backend: *studioUnversionedAssetBackend
          - path: /studio-webmcp.js
            pathType: Exact
            backend: *studioUnversionedAssetBackend
